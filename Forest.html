<!DOCTYPE html>
<html>
  <head>
    <title>CSC3210 Walk through a forest</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="myCanvas"></canvas>
    <script type="module">
    import * as THREE from 'three';
    import Stats from 'three/addons/libs/stats.module.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { ImprovedNoise } from 'three/addons/math/ImprovedNoise.js';
    import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      500
    );
    camera.position.set(0, 60, 120);
    camera.lookAt(0, 5, 0);
    const renderer = new THREE.WebGLRenderer({
      canvas: document.getElementById('myCanvas'),
      antialias: true
    });
    renderer.setClearColor(0x000000);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    const worldWidth = 250, worldDepth = 250;
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.update();

    const forest = generateHeight(worldWidth, worldDepth);
    const terrainGeometry = new THREE.PlaneGeometry(200, 200, worldWidth - 1, worldDepth - 1);
    terrainGeometry.rotateX(-Math.PI / 2);
    const vertices = terrainGeometry.attributes.position.array;
    for (let i = 0, j = 0, l = vertices.length; i < l; i++, j += 3) {
      vertices[j + 1] = forest[i] * 0.25;
    }
    terrainGeometry.computeVertexNormals();

    const terrainMaterial = new THREE.Mesh(terrainGeometry, new THREE.MeshStandardMaterial({ color: 0xffffff}));
    scene.add(terrainMaterial);
    terrainMaterial.receiveShadow = true;

    function generateHeight(width, height) {
      const size = width * height, data = new Uint8Array(size),
      perlin = new ImprovedNoise(), z = Math.random() * 100;
      let quality = 1;
      for (let j = 0; j < 4; j++) {
        for (let i = 0; i < size; i++) {
          const x = i % width, y = ~~(i / width);
          data[i] += Math.abs(perlin.noise(x / quality, y / quality, z) * quality * 1.75);
        }
        quality *= 5;
      }
      return data;
    }
    scene.add(new THREE.AmbientLight(0xcccccc));
    const sunLight = new THREE.DirectionalLight(0xffffff, 1);
    sunLight.position.set(1, 1, 0.5);
    scene.add(sunLight);

    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.left = -100;
    sunLight.shadow.camera.right = 100;
    sunLight.shadow.camera.top = 100;
    sunLight.shadow.camera.bottom = -100;

    const grassTexture = new THREE.TextureLoader().load('forestFloor1.jpeg');
    grassTexture.wrapS = THREE.RepeatWrapping;
    grassTexture.wrapT = THREE.RepeatWrapping;
    grassTexture.repeat.set(10, 10);
    terrainMaterial.material.map = grassTexture;
    
    function buildBranch(state, material) {
      const position = new THREE.Vector3(0.0, state.bLength / 2, 0.0);
      position.applyQuaternion(state.rotation);
      state.position.add(position);
      
      const geometry = new THREE.CylinderGeometry(state.bRadius, state.bRadius, state.bLength, 8);
      const branch = new THREE.Mesh(geometry, material);
      
      branch.quaternion.copy(state.rotation);
      branch.position.copy(state.position);
      branch.castShadow = true;
      state.position.add(position);
      return branch;
    }
    
    function cloneState(state) {
      return {
        bRadius: state.bRadius,
        bLength: state.bLength,
        bReduction: state.bReduction,
        bMinRadius: state.bMinRadius,
        position: new THREE.Vector3().copy(state.position),
        rotation: new THREE.Quaternion().copy(state.rotation)
      };
    }
    
    const treeGrammars = {
      "F": "FF",
      "X": "F[+X][-X]FX"
    };
    const treeAxiom = "X";
    const treeIterations = 3;
    const treeAngle = 25;
    
    function simpleExpand(axiom, rules, iterations) {
      let s = axiom;

      for (let i = 0; i < iterations; i++) {
        let next = '';
        for (const ch of s) next += rules[ch] || ch;s = next;
      }
      return s;
    }
    
    const treeString = simpleExpand(treeAxiom, treeGrammars, treeIterations);
    console.log('expanded length:', treeString.length);
    
    const params = {
      delta: treeAngle,
      branchLength: 1.0,
      branchRadius: 0.30,
      branchReduction: 0.05,
      branchMinRadius: 0.02,
      branchColor: 0x5a3b1a,
      leafColor: 0x3a7a2a,
    };
    
    function treeGeometry(string, params) {
      const basicTree = {
        bRadius: params.branchRadius,
        bLength: params.branchLength,
        bReduction: params.branchReduction,
        bMinRadius: params.branchMinRadius,
        position: new THREE.Vector3(0, 0, 0),
        rotation: new THREE.Quaternion(),
      };
      
      const treeStack = [];
      const parts = [];
      const branchColor = new THREE.Color(params.branchColor);
      const leafColor = new THREE.Color(params.leafColor);
      
      const radianAngle = params.delta * Math.PI / 180;
      const zPosition = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), radianAngle);
      const negativeZPosition = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), -radianAngle);
      const yPosition = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), radianAngle);
      const negativeYPosition = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), -radianAngle);
      const xPosition = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), radianAngle);
      const negativeXPosition = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -radianAngle);
      
      for (let i = 0; i < string.length; i++) {
        const char = string.charAt(i);
        
        if (char === "F") {
          const cylinder = new THREE.CylinderGeometry(basicTree.bRadius, basicTree.bRadius, basicTree.bLength, 6);
          cylinder.translate(0, basicTree.bLength / 2, 0);
          cylinder.applyQuaternion(basicTree.rotation);
          cylinder.translate(basicTree.position.x, basicTree.position.y, basicTree.position.z);
          paintGeometry(cylinder, branchColor);
          parts.push(cylinder);
          basicTree.position.add(new THREE.Vector3(0, basicTree.bLength, 0).applyQuaternion(basicTree.rotation));
        }
        else if (char === "X" || char === "L") {
          const origPos = basicTree.position.clone();
          basicTree.position.add(new THREE.Vector3(0, basicTree.bLength / 8, 0).applyQuaternion(basicTree.rotation));
          const sphere = new THREE.SphereGeometry(basicTree.bLength / 4, 6, 4);
          sphere.translate(basicTree.position.x, basicTree.position.y, basicTree.position.z);
          paintGeometry(sphere, leafColor);
          parts.push(sphere);
          basicTree.position.copy(origPos);
        }
        
        else if (char === "+") basicTree.rotation.multiply(zPosition);
        else if (char === "-") basicTree.rotation.multiply(negativeZPosition);
        else if (char === "&") basicTree.rotation.multiply(negativeYPosition);
        else if (char === "^") basicTree.rotation.multiply(yPosition);
        else if (char === "<") basicTree.rotation.multiply(negativeXPosition);
        else if (char === ">") basicTree.rotation.multiply(xPosition);
        else if (char === "[") {
          treeStack.push(cloneState(basicTree));
          basicTree.bRadius = Math.max(basicTree.bRadius - basicTree.bReduction, basicTree.bMinRadius);
        }
        else if (char === "]") {
          Object.assign(basicTree, cloneState(treeStack.pop()));
        }
      }
      
      const merged = mergeGeometries(parts, false);
      parts.forEach(g => g.dispose());
      return merged;
    }
  function paintGeometry(geom, color) {
    const vertexCount = geom.attributes.position.count;
    const arr = new Float32Array(vertexCount * 3);
    for (let i = 0; i < vertexCount; i++) {
      arr[i * 3] = color.r;
      arr[i * 3 + 1] = color.g;
      arr[i * 3 + 2] = color.b;
    }
    geom.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  }
  
  function sampleHeight(x, z) {
    const terrain = 100;
    const uvCoordinates = (x + terrain) / 200;
    const uvxCoordinates = (z + terrain) / 200;
    const xGrid = uvCoordinates * (worldWidth - 1);
    const zGrid = uvxCoordinates * (worldDepth - 1);
    const xCell = Math.max(0, Math.min(Math.floor(xGrid), worldWidth - 2));
    const zCell = Math.max(0, Math.min(Math.floor(zGrid), worldDepth - 2));
    const xFraction = xGrid - xCell, zFraction = zGrid - zCell;
    const h00 = forest[ zCell * worldWidth + xCell ];
    const h10 = forest[ zCell * worldWidth + xCell + 1];
    const h01 = forest[(zCell + 1) * worldWidth + xCell ];
    const h11 = forest[(zCell + 1) * worldWidth + xCell + 1];
    const zRow0 = h00 + (h10 - h00) * xFraction;
    const zRow1 = h01 + (h11 - h01) * xFraction;
    return (zRow0 + (zRow1 - zRow0) * zFraction) * 0.25;
  }
  
  const buildTreeGeometry = treeGeometry(treeString, params);
  const treeMaterial = new THREE.MeshStandardMaterial({
    vertexColors: true,
    flatShading: true,
    roughness: 0.85,
  });
  
  const treeCount = 100;
  const forestMesh = new THREE.InstancedMesh(buildTreeGeometry, treeMaterial, treeCount);
  forestMesh.castShadow = true;
  forestMesh.receiveShadow = true;
  
  const dummy = new THREE.Object3D();
  
  for (let i = 0; i < treeCount; i++) {
    const x = (Math.random() - 0.5) * 180;
    const z = (Math.random() - 0.5) * 180;
    const y = sampleHeight(x, z);
    
    dummy.position.set(x, y, z);
    dummy.rotation.y = Math.random() * Math.PI * 2;
    dummy.scale.setScalar(0.7 + Math.random() * 0.6);
    dummy.updateMatrix();
    forestMesh.setMatrixAt(i, dummy.matrix);
  }
  
  forestMesh.instanceMatrix.needsUpdate = true;
  scene.add(forestMesh);
    function animate(){
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
    </script>
    </body>
</html>
